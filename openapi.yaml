openapi: 3.0.3
info:
  title: Document Processing System API
  version: 1.0.0
  description: |
    Asynchronous document processing system with REST API for batch text analysis, progress tracking, and process control (pause/resume/stop).
servers:
  - url: http://localhost:8080
paths:
  /process/start:
    post:
      summary: Start a new document processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                folder_path:
                  type: string
                  example: /data
                batch_size:
                  type: integer
                  example: 1
              required:
                - folder_path
                - batch_size
      responses:
        '200':
          description: Process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_id:
                    type: string
                  status:
                    type: string
                    enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, STOPPED]
              example:
                process_id: "uuid-string"
                status: "PENDING"
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /process/stop/{process_id}:
    post:
      summary: Stop a running process
      parameters:
        - in: path
          name: process_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
              example:
                process_id: "uuid-string"
                status: "STOPPED"
                message: "Process stopped"
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /process/pause/{process_id}:
    post:
      summary: Pause a running process
      parameters:
        - in: path
          name: process_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
              example:
                process_id: "uuid-string"
                status: "PAUSED"
                message: "Process paused"
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /process/resume/{process_id}:
    post:
      summary: Resume a paused process
      parameters:
        - in: path
          name: process_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_id:
                    type: string
                  status:
                    type: string
                  message:
                    type: string
              example:
                process_id: "uuid-string"
                status: "RUNNING"
                message: "Process resumed"
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /process/status/{process_id}:
    get:
      summary: Get the status of a process
      parameters:
        - in: path
          name: process_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process status
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_id:
                    type: string
                  status:
                    type: string
                    enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, STOPPED]
                  progress:
                    type: object
                    properties:
                      total_files:
                        type: integer
                      processed_files:
                        type: integer
                      percentage:
                        type: number
                        format: float
                  started_at:
                    type: string
                    format: date-time
                  estimated_completion:
                    type: string
                    format: date-time
                    nullable: true
                  results:
                    type: object
                    properties:
                      total_words:
                        type: integer
                      total_lines:
                        type: integer
                      most_frequent_words:
                        type: array
                        items:
                          type: string
                      files_processed:
                        type: array
                        items:
                          type: string
              example:
                process_id: "uuid-string"
                status: "RUNNING"
                progress:
                  total_files: 10
                  processed_files: 3
                  percentage: 30
                started_at: "2024-01-15T10:30:00Z"
                estimated_completion: "2024-01-15T10:32:00Z"
                results:
                  total_words: 1500
                  total_lines: 75
                  most_frequent_words: ["the", "of", "and"]
                  files_processed: ["doc1.txt", "doc2.txt", "doc3.txt"]
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /process/list:
    get:
      summary: List all processes
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: object
                properties:
                  processes:
                    type: array
                    items:
                      type: object
                      properties:
                        process_id:
                          type: string
                        status:
                          type: string
                        progress:
                          type: object
                          properties:
                            total_files:
                              type: integer
                            processed_files:
                              type: integer
                            percentage:
                              type: number
                        started_at:
                          type: string
                          format: date-time
                        estimated_completion:
                          type: string
                          format: date-time
                          nullable: true
                        results:
                          type: object
                          properties:
                            total_words:
                              type: integer
                            total_lines:
                              type: integer
                            most_frequent_words:
                              type: array
                              items:
                                type: string
                            files_processed:
                              type: array
                              items:
                                type: string
              example:
                processes:
                  - process_id: "uuid-string"
                    status: "COMPLETED"
                    progress:
                      total_files: 10
                      processed_files: 10
                      percentage: 100.0
                    started_at: "2024-01-15T10:30:00Z"
                    estimated_completion: "2024-01-15T10:32:00Z"
                    results:
                      total_words: 1500
                      total_lines: 75
                      most_frequent_words: ["the", "of", "and"]
                      files_processed: ["doc1.txt", "doc2.txt", "doc3.txt"]
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /process/results/{process_id}:
    get:
      summary: Get analysis results for a process
      parameters:
        - in: path
          name: process_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Analysis results
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_id:
                    type: string
                  status:
                    type: string
                    enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, STOPPED]
                  progress:
                    type: object
                    properties:
                      total_files:
                        type: integer
                      processed_files:
                        type: integer
                      percentage:
                        type: number
                        format: float
                  started_at:
                    type: string
                    format: date-time
                  estimated_completion:
                    type: string
                    format: date-time
                    nullable: true
                  results:
                    type: object
                    properties:
                      total_words:
                        type: integer
                      total_lines:
                        type: integer
                      most_frequent_words:
                        type: array
                        items:
                          type: string
                      files_processed:
                        type: array
                        items:
                          type: string
              example:
                process_id: "uuid-string"
                status: "COMPLETED"
                progress:
                  total_files: 10
                  processed_files: 10
                  percentage: 100
                started_at: "2024-01-15T10:30:00Z"
                estimated_completion: "2024-01-15T10:32:00Z"
                results:
                  total_words: 1500
                  total_lines: 75
                  most_frequent_words: ["the", "of", "and"]
                  files_processed: ["doc1.txt", "doc2.txt", "doc3.txt"]
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: integer
              example:
                status: ok
                timestamp: 1704110400
components:
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              details:
                type: string
          example:
            error: "Error description"
            details: "Additional error details" 